name: Build

# Builds one customer's Android test app from an app config. The Site2App site
# starts this through the GitHub API (workflow_dispatch). The APK and a picture
# of its launcher icon are published as a pre-release named build-<id>, which
# anyone with the link can download; cleanup.yml deletes it after 14 days.
#
# This repository is public, so a run's inputs (the config) and its log are
# public too. The site says so before anyone builds.
#
# Inputs reach the scripts through environment variables, never written into
# a run: line, so nothing in a config can become a shell command.

run-name: build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "12 to 40 lower-case letters and digits; names the release"
        required: true
        type: string
      config:
        description: "The app config: JSON, gzipped, then base64"
        required: true
        type: string
      version_code:
        description: "Android versionCode"
        required: false
        type: string
        default: "1"

permissions:
  contents: write

jobs:
  android:
    name: Android test build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_ID: ${{ inputs.build_id }}
      VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Check the inputs
        run: |
          [[ "$BUILD_ID" =~ ^[a-z0-9]{12,40}$ ]] || { echo "::error::build_id must be 12 to 40 lower-case letters and digits"; exit 1; }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::version_code must be a positive whole number"; exit 1; }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the build scripts
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Apply the app config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          printf '%s' "$CONFIG" | base64 --decode | gunzip > "$RUNNER_TEMP/build/app-config.json"
          node scripts/apply-config.mjs "$RUNNER_TEMP/build/app-config.json" --version-code "$VERSION_CODE"

      - name: Restore the test signing key
        env:
          KEYSTORE: ${{ secrets.SHELL_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The SHELL_TEST_KEYSTORE_BASE64 secret is not set."; exit 1; fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/test.jks"
          echo "SHELL_KEYSTORE_FILE=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"

      - name: Compile and sign
        working-directory: android
        env:
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_TEST_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_TEST_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_TEST_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="$RUNNER_TEMP/build/app-config.json"
          package=$(jq -r '.app.androidPackage' "$config")
          version=$(jq -r '.app.versionName' "$config")
          apk="$RUNNER_TEMP/build/$package-$version-test.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          jq -r '"Android test build of \(.app.name) (\(.app.androidPackage)), version \(.app.versionName), from Site2App.\n\nInstall it on your own phone to try the app. It is signed with the Site2App test key, so it is not for Google Play. This release is deleted after 14 days."' "$config" > "$RUNNER_TEMP/build/notes.md"
          gh release create "build-$BUILD_ID" "$apk" android/build/launcher-icon.png \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Build $BUILD_ID" \
            --notes-file "$RUNNER_TEMP/build/notes.md"
