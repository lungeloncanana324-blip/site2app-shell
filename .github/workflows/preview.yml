name: Preview

# Runs one build's APK on an Android emulator and photographs a scripted tour
# (scripts/tour.py says what a tour can do). For seeing a customer's app on a
# phone before anyone installs it. The pictures are this run's artifact.
#
# The emulator is the Play Store image, because it has Chrome: links that
# leave the app need a browser to land in.

run-name: preview ${{ inputs.build_id || 'from a link' }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "A GitHub build to run: the part after build- in its release name"
        required: false
        type: string
      apk_url:
        description: "Or an APK address to download, such as a presigned link to a Fly build"
        required: false
        type: string
      tour:
        description: "The tour, as a JSON list of steps"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tour:
    name: Run on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_ID: ${{ inputs.build_id }}
      APK_URL: ${{ inputs.apk_url }}
      TOUR: ${{ inputs.tour }}

    steps:
      - name: Check the inputs
        run: |
          if [ -n "$APK_URL" ]; then
            [[ "$APK_URL" =~ ^https:// ]] || { echo "::error::apk_url must be an https address"; exit 1; }
          else
            [[ "$BUILD_ID" =~ ^[a-z0-9]{12,40}$ ]] || { echo "::error::give apk_url, or a build_id of 12 to 40 lower-case letters and digits"; exit 1; }
          fi
          printf '%s' "$TOUR" | python3 -c "import json, sys; steps = json.load(sys.stdin); assert isinstance(steps, list)"

      - uses: actions/checkout@v5

      - name: Download the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          if [ -n "$APK_URL" ]; then
            curl -fsSL --max-time 120 -o apk/app.apk "$APK_URL"
          else
            gh release download "build-$BUILD_ID" --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir apk
          fi
          ls -l apk

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install it and take the tour
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: adb install -r apk/*.apk && python3 scripts/tour.py apk/*.apk "$TOUR" tour

      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tour
          path: tour/
          if-no-files-found: error
